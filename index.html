<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="src/css/stylenda.css" />
    <script src="https://kit.fontawesome.com/2d676e8f7d.js" crossorigin="anonymous"></script>
    <script type="module" src="src/js/main.js"></script>
    <title>DevTask</title>
  </head>
  <body>
    <header class="header">
      <div class="header__container container">
        <div class="header__info">
          <h1>Tarefas</h1>
          <p>Acompanhe tudo sobre sua equipe em um só lugar.</p>
        </div>
        <button class="btn btn--primary" id="btn-open-modal" aria-label="Adicionar tarefa">
          <span class="btn__text">Adicionar tarefa</span>
          <i class="fa-solid fa-plus" aria-hidden="true"></i>
        </button>
      </div>
    </header>
    <main class="board container">
      <section class="column" data-status="todo">
        <h2 class="column__title column__title--todo">Pendentes</h2>
        <ul class="column__list column__list--todo"></ul>
      </section>
      <section class="column" data-status="inprogress">
        <h2 class="column__title column__title--inprogress">Em andamento</h2>
        <ul class="column__list column__list--inprogress"></ul>
      </section>
      <section class="column" data-status="completed">
        <h2 class="column__title column__title--completed">Concluídas</h2>
        <ul class="column__list column__list--completed"></ul>
      </section>
    </main>
    <dialog class="modal" id="modal">
      <div class="modal__content">
        <h4 class="modal__title">Nova tarefa</h4>

        <form class="modal__form form" id="form">
          <div class="form__wrapper">
            <label class="form__label" for="task-name">Título da tarefa</label>
            <input type="text" placeholder="Titulo da tarefa" id="task-name" class="form__input" />
            <span class="error-message" id="form-error"></span>
          </div>
          <div class="form__wrapper">
            <label class="form__label" for="task-description">Descrição</label>
            <textarea
              placeholder="Descricão"
              id="task-description"
              cols="30"
              rows="10"
              class="form__textarea"
            ></textarea>
          </div>
          <div class="form__actions">
            <button class="btn btn--secondary" id="btn-cancel" type="button">Cancelar</button>
            <button class="btn btn--primary" id="btn-add-task">Criar tarefa</button>
          </div>
        </form>

        <button type="button" class="modal__close-button" id="btn-close" aria-label="Fechar modal">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </dialog>
  </body>
</html>
